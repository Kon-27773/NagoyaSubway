<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東山線 乗車位置検索</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>東山線 乗車位置検索</h1>

    <div class="form">
        <label for="start">始点</label>
        <select id="start">
            <option value="">選択してください</option>
            <option value="千種">千種</option>
            <option value="今池">今池</option>
            <option value="池下">池下</option>
        </select>

        <label for="goal">終点</label>
        <select id="goal">
            <option value="">選択してください</option>
            <option value="千種">千種</option>
            <option value="今池">今池</option>
            <option value="池下">池下</option>
        </select>

        <button onclick="search()">検索</button>
    </div>

    <div id="result"></div>

    <script src="script.js"></script>

</body>
</html>
